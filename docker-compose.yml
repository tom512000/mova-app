services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letterboxd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letterboxd}
      POSTGRES_DB: ${POSTGRES_DB:-letterboxd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letterboxd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changemechangemechangeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-letterboxd}:${POSTGRES_PASSWORD:-letterboxd}@postgres:5432/${POSTGRES_DB:-letterboxd}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
      LETTERBOXD_USERNAME: ${LETTERBOXD_USERNAME:-}
      LETTERBOXD_RSS_SYNC_ENABLED: ${LETTERBOXD_RSS_SYNC_ENABLED:-false}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    ports:
      - "${BACKEND_PORT:-8000}:80"

  backend-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changemechangemechangeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-letterboxd}:${POSTGRES_PASSWORD:-letterboxd}@postgres:5432/${POSTGRES_DB:-letterboxd}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
      LETTERBOXD_USERNAME: ${LETTERBOXD_USERNAME:-}
      LETTERBOXD_RSS_SYNC_ENABLED: ${LETTERBOXD_RSS_SYNC_ENABLED:-false}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    depends_on:
      - postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
