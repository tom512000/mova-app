services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letterboxd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letterboxd}
      POSTGRES_DB: ${POSTGRES_DB:-letterboxd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letterboxd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Set APP_DEBUG=0 when the project sits on a slow filesystem (a Windows bind mount, a
      # OneDrive folder). Debug mode re-checks every file the DI container was compiled from
      # on each request, which is ~1s of pure stat() there. The cost is that changes to
      # config, services or routes then need `php bin/console cache:clear`.
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-changemechangemechangeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-letterboxd}:${POSTGRES_PASSWORD:-letterboxd}@postgres:5432/${POSTGRES_DB:-letterboxd}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
      LETTERBOXD_USERNAME: ${LETTERBOXD_USERNAME:-}
      LETTERBOXD_RSS_SYNC_ENABLED: ${LETTERBOXD_RSS_SYNC_ENABLED:-false}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      # var/cache holds the compiled DI container, and Symfony's dev mode stats every file
      # it was built from on each request. Over the Windows bind mount above that alone cost
      # ~2.4s per request; keeping it on a container-local volume brings it back to normal.
      # var/share (the app cache pool) and var/imports deliberately stay on the bind mount:
      # both are shared with the worker and meant to outlive a `cache:clear`.
      - backend_cache:/app/var/cache
      - backend_log:/app/var/log
    ports:
      - "${BACKEND_PORT:-8000}:80"

  backend-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changemechangemechangeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-letterboxd}:${POSTGRES_PASSWORD:-letterboxd}@postgres:5432/${POSTGRES_DB:-letterboxd}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
      LETTERBOXD_USERNAME: ${LETTERBOXD_USERNAME:-}
      LETTERBOXD_RSS_SYNC_ENABLED: ${LETTERBOXD_RSS_SYNC_ENABLED:-false}
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      # Its own cache volume rather than the web container's: two processes warming the same
      # compiled container concurrently can race. Both still rebuild on their own when a
      # config file changes, since the source stays bind-mounted.
      - backend_worker_cache:/app/var/cache
      - backend_worker_log:/app/var/log

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    depends_on:
      - postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  postgres_data:
  backend_vendor:
  backend_cache:
  backend_log:
  backend_worker_cache:
  backend_worker_log:
  frontend_node_modules:
