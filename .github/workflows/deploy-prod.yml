name: Deploy Mova Production

on:
  push:
    branches:
      - prod

  workflow_dispatch:

concurrency:
  group: mova-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OVH VPS
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          # `tr -d '\r'` is not defensive clutter: a key copied through a Windows tool
          # carries CRLF, the \r lands inside the base64 body, and ssh fails with the
          # unhelpful "error in libcrypto" - which reads like a broken key rather than a
          # mangled paste. printf supplies the trailing newline the clipboard drops.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Fails here, on the step that is actually wrong, instead of surfacing as
          # "Permission denied (publickey)" against the VPS - which sends you reading
          # authorized_keys on a server that was never offered a key in the first place.
          #
          # </dev/null matters: ssh-keygen prompts for a passphrase on an encrypted key,
          # and a prompt that reads EOF looks exactly like a corrupt key from the outside.
          # Its own stderr is what separates the two, so it is reported rather than hidden.
          if ! KEY_ERROR="$(ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null 2>&1 >/dev/null)"; then
            echo "::group::Diagnostic VPS_SSH_KEY"

            # Structure only. Never a line of the body: GitHub masks a secret by exact
            # match, so a fragment of it would print in clear. Headers are public strings
            # and byte counts leak nothing, but they identify the failure on their own.
            echo "ssh-keygen : ${KEY_ERROR:-<aucun message>}"
            echo "octets     : $(wc -c < ~/.ssh/id_ed25519)"
            echo "lignes     : $(wc -l < ~/.ssh/id_ed25519)"
            echo "1re ligne  : $(head -n 1 ~/.ssh/id_ed25519 | cut -c1-40)"

            if [ ! -s ~/.ssh/id_ed25519 ] || [ "$(wc -c < ~/.ssh/id_ed25519)" -lt 2 ]; then
              echo "-> Le secret est vide. Il n'existe pas, ou il est defini ailleurs que"
              echo "   sur ce depot / cet environnement (secret d'organisation non accorde,"
              echo "   ou secret Dependabot, qui n'est pas visible depuis Actions)."
            elif grep -q 'PuTTY-User-Key-File' ~/.ssh/id_ed25519; then
              echo "-> Format PuTTY (.ppk). Convertis-le : puttygen cle.ppk -O private-openssh -o id_ed25519"
            elif head -n 1 ~/.ssh/id_ed25519 | grep -qE '^(ssh-|ecdsa-)'; then
              echo "-> C'est la cle PUBLIQUE. Le secret attend le fichier sans .pub."
            elif echo "$KEY_ERROR" | grep -qi 'passphrase'; then
              # Read off ssh-keygen's message, not the file: an encrypted key in the modern
              # OPENSSH format carries no marker at all, so grepping for Proc-Type - the
              # old PEM one - silently missed every key generated in the last decade.
              echo "-> Cle protegee par passphrase. Une Action ne peut pas la saisir :"
              echo "   genere une cle de deploiement dediee et sans passphrase."
            elif head -n 1 ~/.ssh/id_ed25519 | grep -q '^b3BlbnNzaC1rZXktdjEA'; then
              # That base64 decodes to "openssh-key-v1", the magic every OpenSSH private
              # key body opens with. Seeing it on line 1 means the body survived and only
              # the two -----BEGIN/END----- lines were lost - a paste that dropped the
              # first and last line, not a truncated key.
              #
              # Deliberately not repaired by re-adding the armour: the secret would stay
              # wrong, the next person to rotate it would hit this again, and a body that
              # IS short would get wrapped into a key that fails further downstream.
              echo "-> Armure absente. Le corps de la cle est la, mais les lignes"
              echo "   -----BEGIN OPENSSH PRIVATE KEY----- et -----END----- manquent."
              echo "   Le collage a perdu la premiere et la derniere ligne du fichier."
            elif ! head -n 1 ~/.ssh/id_ed25519 | grep -q 'BEGIN .*PRIVATE KEY'; then
              echo "-> En-tete non reconnu. Le secret n'est pas une cle privee."
            else
              echo "-> En-tete correct mais corps illisible : le collage a altere le base64."
            fi

            echo ""
            echo "Repose le secret sans passer par le presse-papier :"
            echo "  gh secret set VPS_SSH_KEY --env production < ~/.ssh/id_ed25519"
            echo "::endgroup::"

            echo "::error::VPS_SSH_KEY n'est pas une cle privee OpenSSH utilisable - voir le diagnostic ci-dessus."
            exit 1
          fi

      - name: Deploy Mova
        run: |
          # The quoted heredoc delimiter matters: unquoted, the runner would expand $VAR
          # here and send the result, so the remote shell would receive values from the
          # wrong machine. Quoted, every line travels verbatim.
          ssh \
            -o BatchMode=yes \
            -T \
            ubuntu@vps-93991c4a.vps.ovh.net <<'REMOTE'
          set -euo pipefail

          cd /opt/apps/mova

          # reset --hard rather than pull: a deploy should land on exactly what is on the
          # branch, not on a merge of it with whatever state the server drifted into.
          # .env.prod is gitignored, so the one file that IS edited on the server survives
          # this untouched - which is the only reason it is safe here.
          git fetch --prune origin
          git reset --hard origin/prod

          # --build because the images are the deploy unit; the migrate service runs the
          # migrations once and the others wait for it to succeed.
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

          # Old image layers pile up fast with a rebuild on every push.
          docker image prune -f

          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          REMOTE
