framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ProcessImportBatchMessage: async
            App\Message\EnrichMovieMessage: async
            App\Message\SyncLetterboxdRssMessage: async

# Tests dispatch for real — an import ends by queueing an enrichment job for every film it
# touched — but they have no worker to consume any of it, and the doctrine transport would
# need its table created inside a transaction the test then rolls back. In-memory keeps
# dispatching a genuine operation that can genuinely fail, without a queue behind it.
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
