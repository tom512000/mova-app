security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            provider: app_users
            lazy: true
            # Session-backed rather than a token: the SPA and the API are same-site in every
            # deployment of this app, so a cookie the browser attaches on its own avoids
            # storing a credential in JS where XSS could read it.
            context: app
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonAuthenticationHandler
                failure_handler: App\Security\JsonAuthenticationHandler
            logout:
                path: api_auth_logout
                # The SPA calls this with axios, so there is nothing to redirect to.
                # ApiLogoutSubscriber sets a 204 on LogoutEvent; without it the listener
                # falls back to a 302 that axios follows into an HTML page.
                invalidate_session: true
            entry_point: App\Security\JsonAuthenticationHandler

    access_control:
        # Login is the only public door. Accepting a share link is deliberately NOT public:
        # a grant records *who* was given access, so the recipient has to be a known account.
        # Only the first matching rule applies, so the specific path has to come first.
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
