nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # X-Requested-With is not CORS-safelisted, so axios sending it turns every call into
        # a preflighted one — and a preflight that does not name the header here is refused
        # with a 400 before the request is ever made. It is sent on purpose: see apiClient.ts.
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        expose_headers: ['Link']
        # Authentication is a session cookie, so the browser only attaches it when the
        # response says credentials are allowed — and it refuses to pair that with a
        # wildcard origin, which is why allow_origin stays an explicit regex.
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': null
