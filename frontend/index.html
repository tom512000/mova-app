<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything below is static on purpose. This is a client-rendered SPA, and the crawlers
      that build link previews — Facebook, WhatsApp, Slack, Discord, LinkedIn, iMessage —
      never run JavaScript. What is written here is the only thing they will ever see, so a
      tag that a component sets at runtime is a tag those crawlers do not get.
    -->
    <title>Mova — Stats. Films. You.</title>
    <meta
      name="description"
      content="Tes statistiques de cinéma à partir de ton export Letterboxd : genres, réalisateurs, pays, temps passé, et huit jeux tirés des films que tu as vus."
    />

    <meta property="og:site_name" content="Mova" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Mova — Stats. Films. You." />
    <meta
      property="og:description"
      content="Tes statistiques de cinéma à partir de ton export Letterboxd : genres, réalisateurs, pays, temps passé, et huit jeux tirés des films que tu as vus."
    />
    <!--
      TODO at deploy: make this absolute (https://votre-domaine/og-mova.png) and add
      <meta property="og:url"> plus <link rel="canonical">. Several crawlers resolve a
      relative image against the page, but the specification wants an absolute URL and the
      strict ones simply drop the card. Neither tag can be written before the domain exists,
      and a canonical pointing at the wrong host is worse than none.
    -->
    <meta property="og:image" content="/og-mova.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mova — Stats. Films. You." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Dark is the default edition, so the mobile browser chrome matches it. -->
    <meta name="theme-color" content="#131211" />

    <!--
      The fonts used to be pulled by an @import at the top of index.css, which is the slowest
      shape available: the browser had to fetch our stylesheet, parse it, discover the import,
      fetch Google's stylesheet, parse that, and only then start on the font files — four
      serialised round trips before a single character could be painted. Declared here they
      are found in the initial HTML scan, and the two preconnects open the sockets while that
      is still happening.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
