; Production PHP settings. Only what differs from the image defaults in a way that matters.

; The code in an image cannot change while the container runs, so there is nothing to check
; for. This is the single biggest difference between a tuned and an untuned PHP deploy — and
; it is also why the image must be rebuilt to deploy, never patched in place.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Symfony resolves a great many paths per request; the default of 4M is spent quickly.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Errors go to the log, never to the response. Symfony renders its own error page, but a
; fatal that happens before the kernel boots would otherwise print a path into the browser.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; A Letterboxd export is capped at 100 MB by ImportController; PHP has to let one through
; before that check can run.
upload_max_filesize = 100M
post_max_size = 104M
memory_limit = 256M
